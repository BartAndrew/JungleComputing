name: Jungle MCP and manuals

on:
  push:
    paths: ["core/**", "docs/manual/**", ".github/workflows/jungle-mcp.yml"]
  pull_request:
    paths: ["core/**", "docs/manual/**", ".github/workflows/jungle-mcp.yml"]

permissions:
  contents: read

jobs:
  mcp-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r core/mcp/requirements.txt
      - run: python -m unittest discover -s core/mcp/tests -p test_engine.py -v
      - run: python core/mcp/tests/sdk_smoke.py

  mcp-live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r core/mcp/requirements.txt
      - run: python core/tools/init_local.py
      - run: docker compose -f core/docker-compose.yml config --quiet
      - run: docker compose -f core/docker-compose.yml up -d --build --wait --wait-timeout 180
      - run: python core/tests/smoke.py
      - run: python core/mcp/tests/sdk_smoke.py --live
      - name: Service logs on failure
        if: failure()
        run: docker compose -f core/docker-compose.yml logs --tail=100 registry repair-network
      - name: Clean up disposable CI environment
        if: always()
        run: docker compose -f core/docker-compose.yml down -v
