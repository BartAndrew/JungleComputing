<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">Jungle Computing Logo</title>
  <desc id="desc">Neon blue and gold Jungle Computing logo showing four connected tower/island petals and wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .word { font-family: Orbitron, Rajdhani, Inter, Arial, sans-serif; font-weight: 800; letter-spacing: 8px; fill: #f8fafc; }
      .sub { font-family: Inter, Arial, sans-serif; font-weight: 600; letter-spacing: 14px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="920" height="220" fill="#020617" rx="24"/>
  <g transform="translate(46 36)" filter="url(#glow)">
    <path d="M74 0 L122 44 L90 78 L42 34 Z" fill="url(#blue)" opacity="0.95"/>
    <path d="M0 74 L44 26 L78 58 L34 106 Z" fill="url(#blue)" opacity="0.88"/>
    <path d="M106 42 L148 86 L104 132 L72 98 Z" fill="url(#gold)" opacity="0.95"/>
    <path d="M42 116 L86 72 L120 104 L76 148 Z" fill="url(#blue)" opacity="0.92"/>
    <circle cx="74" cy="74" r="11" fill="#e0f2fe"/>
    <path d="M74 74 L74 8 M74 74 L12 74 M74 74 L134 74 M74 74 L74 138" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text x="238" y="92" class="word" font-size="48">JUNGLE</text>
  <text x="238" y="150" class="word" font-size="48" fill="#38bdf8">COMPUTING</text>
  <text x="242" y="190" class="sub" font-size="14">BROWSER-FIRST P2P COMPUTE</text>
</svg>
