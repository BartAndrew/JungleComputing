<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monolithic vs Jungle Computing</title>
  <desc id="desc">Comparison between traditional centralized architecture and Jungle Computing distributed mesh architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: Orbitron, Inter, sans-serif; font-weight: 800; letter-spacing: 4px; fill: #f8fafc; }
      .label { font-family: Inter, Arial, sans-serif; fill: #cbd5e1; font-size: 22px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #94a3b8; font-size: 18px; }
      .panel { fill: rgba(15,23,42,0.75); stroke: rgba(56,189,248,0.18); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="160" y="90" class="title" font-size="44">TRADITIONAL MONOLITHIC WEB MODEL</text>
  <text x="920" y="90" class="title" font-size="44">JUNGLE COMPUTING MESH MODEL</text>

  <rect x="70" y="120" width="650" height="700" rx="28" class="panel"/>
  <rect x="860" y="120" width="670" height="700" rx="28" class="panel"/>

  <!-- LEFT SIDE -->
  <g>
    <rect x="280" y="260" width="230" height="120" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="3" filter="url(#glowGold)"/>
    <text x="335" y="315" class="label">Central API</text>
    <text x="352" y="345" class="small">Server</text>

    <rect x="290" y="480" width="210" height="90" rx="16" fill="#111827" stroke="#f97316" stroke-width="3" filter="url(#glowGold)"/>
    <text x="348" y="532" class="label">Database</text>

    <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
      <rect x="120" y="170" width="120" height="70" rx="14"/>
      <rect x="540" y="170" width="120" height="70" rx="14"/>
      <rect x="110" y="620" width="120" height="70" rx="14"/>
      <rect x="550" y="620" width="120" height="70" rx="14"/>
    </g>

    <text x="150" y="212" class="small">Browser</text>
    <text x="572" y="212" class="small">Browser</text>
    <text x="140" y="662" class="small">Browser</text>
    <text x="580" y="662" class="small">Browser</text>

    <path d="M240 205 L320 260" stroke="#ef4444" stroke-width="4" opacity="0.85"/>
    <path d="M540 205 L470 260" stroke="#ef4444" stroke-width="4" opacity="0.85"/>
    <path d="M230 620 L320 380" stroke="#ef4444" stroke-width="4" opacity="0.85"/>
    <path d="M550 620 L470 380" stroke="#ef4444" stroke-width="4" opacity="0.85"/>

    <path d="M395 380 L395 480" stroke="#f97316" stroke-width="6" opacity="0.9"/>

    <text x="180" y="760" class="label">Single Point of Load</text>
    <text x="180" y="790" class="small">All traffic, logic, and data flow through the center.</text>
  </g>

  <!-- RIGHT SIDE -->
  <g>
    <circle cx="1190" cy="440" r="210" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.18"/>

    <!-- Towers -->
    <g filter="url(#glowBlue)">
      <rect x="1090" y="260" width="70" height="220" rx="8" fill="url(#blue)" opacity="0.9"/>
      <rect x="1100" y="450" width="50" height="50" rx="4" fill="url(#gold)"/>

      <rect x="1260" y="320" width="80" height="180" rx="8" fill="url(#blue)" opacity="0.9"/>
      <rect x="1272" y="470" width="56" height="44" rx="4" fill="url(#gold)"/>

      <rect x="1000" y="510" width="60" height="150" rx="8" fill="url(#blue)" opacity="0.9"/>
      <rect x="1008" y="635" width="44" height="34" rx="4" fill="url(#gold)"/>

      <rect x="1320" y="560" width="70" height="160" rx="8" fill="url(#blue)" opacity="0.9"/>
      <rect x="1330" y="690" width="50" height="36" rx="4" fill="url(#gold)"/>

      <rect x="1160" y="560" width="90" height="240" rx="8" fill="url(#blue)" opacity="0.92"/>
      <rect x="1174" y="770" width="62" height="40" rx="4" fill="url(#gold)"/>
    </g>

    <!-- Mesh links -->
    <g stroke="#38bdf8" stroke-width="4" opacity="0.9">
      <path d="M1125 300 L1300 360"/>
      <path d="M1125 420 L1030 560"/>
      <path d="M1125 380 L1205 620"/>
      <path d="M1300 430 L1360 590"/>
      <path d="M1205 640 L1360 610"/>
      <path d="M1030 600 L1205 680"/>
    </g>

    <!-- Authority node -->
    <circle cx="1195" cy="200" r="38" fill="#f59e0b" filter="url(#glowGold)"/>
    <text x="1125" y="155" class="small">Authority / Signalling</text>

    <path d="M1195 238 L1125 300" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
    <path d="M1195 238 L1300 360" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>

    <text x="980" y="760" class="label">Distributed Peer Mesh</text>
    <text x="980" y="790" class="small">Peers communicate directly while shared foundation layers maintain trust, routing, and synchronization.</text>
  </g>

  <!-- Center divider -->
  <line x1="800" y1="120" x2="800" y2="820" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 12"/>

  <text x="640" y="860" class="small">Centralized compute and state</text>
  <text x="1020" y="860" class="small">Browser-first peer-to-peer distributed architecture</text>
</svg>
