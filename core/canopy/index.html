<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jungle Canopy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#020617; --panel:#07111f; --panel2:#0a1628; --text:#f8fafc; --muted:#94a3b8;
      --blue:#38bdf8; --gold:#f59e0b; --green:#22c55e; --red:#ef4444; --purple:#a855f7; --border:#18314a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#0a1628 0,#020617 58%);color:var(--text);min-height:100vh}
    header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:center;justify-content:space-between;background:rgba(2,6,23,.88);position:sticky;top:0;backdrop-filter:blur(16px);z-index:5}
    h1{font-size:20px;letter-spacing:.18em;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}
    .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.12em}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 14px var(--green)}
    main{padding:24px 28px 40px;max-width:1440px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{background:rgba(7,17,31,.88);border:1px solid var(--border);padding:16px;border-radius:14px}.metric b{font-size:25px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
    .layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,.8fr);gap:16px}.panel{background:rgba(7,17,31,.88);border:1px solid var(--border);border-radius:16px;padding:18px;min-width:0}.panel h2{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:#cbd5e1}
    .network{min-height:520px;display:grid;align-content:start;gap:18px}.island{border:1px solid #1d3a55;background:linear-gradient(180deg,rgba(14,165,233,.04),rgba(245,158,11,.025));border-radius:18px;padding:14px}.island-title{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}.city-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.tower{position:relative;border:1px solid #1e4567;border-radius:12px;padding:12px;background:linear-gradient(180deg,rgba(56,189,248,.11),rgba(245,158,11,.08));min-height:130px;cursor:pointer;transition:.18s ease}.tower:hover{transform:translateY(-2px);border-color:var(--blue)}.tower.offline{opacity:.48;border-color:#4b5563}.tower.degraded{border-color:var(--gold)}.tower-head{display:flex;justify-content:space-between;gap:8px}.tower-name{font-weight:700}.badge{font-size:10px;border:1px solid currentColor;padding:3px 6px;border-radius:999px;height:max-content}.online{color:var(--green)}.offlineText{color:var(--red)}.degradedText{color:var(--gold)}.type{font-size:11px;color:var(--muted);margin:4px 0 12px}.bars{display:grid;gap:7px}.row{display:grid;grid-template-columns:54px 1fr 36px;gap:7px;align-items:center;font-size:10px;color:var(--muted)}.bar{height:7px;border-radius:999px;background:#0f2237;overflow:hidden}.fill{height:100%;background:var(--blue)}.memory .fill{background:var(--purple)}
    .events{display:grid;gap:8px;max-height:490px;overflow:auto}.event{padding:10px 11px;border-left:2px solid var(--blue);background:#06101e;border-radius:8px}.event strong{font-size:11px}.event div{font-size:10px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center}
    .detail{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;font-size:12px;color:var(--muted);display:none}.detail.show{display:block}.kv{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:7px 0}.kv b{color:#dbeafe;font-weight:600}.caps{display:flex;gap:5px;flex-wrap:wrap}.cap{font-size:10px;padding:3px 6px;border-radius:7px;background:#0c2138;color:#bae6fd}
    @media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}header{align-items:flex-start}.network{min-height:0}}
    @media(max-width:520px){header,main{padding-left:16px;padding-right:16px}.metrics{grid-template-columns:1fr 1fr}.metric b{font-size:20px}.city-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div><h1>JUNGLE CANOPY</h1><div class="sub">Core v0.1 · live node registry and observation surface</div></div>
  <div class="live"><span class="dot"></span><span id="connection">connecting</span></div>
</header>
<main>
  <section class="metrics">
    <div class="metric"><b id="nodeCount">0</b><span>Registered Towers</span></div>
    <div class="metric"><b id="onlineCount">0</b><span>Online</span></div>
    <div class="metric"><b id="cityCount">0</b><span>Cities</span></div>
    <div class="metric"><b id="avgCpu">0%</b><span>Average CPU</span></div>
  </section>
  <section class="layout">
    <div class="panel"><h2>Live topology</h2><div id="network" class="network"><div class="empty">Waiting for Jungle nodes…</div></div><div id="detail" class="detail"></div></div>
    <div class="panel"><h2>Event stream</h2><div id="events" class="events"><div class="empty">Waiting for platform events…</div></div></div>
  </section>
</main>
<script>
  const network = document.getElementById('network');
  const eventsEl = document.getElementById('events');
  const detail = document.getElementById('detail');
  let nodes=[]; let events=[];

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function pct(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):0}
  function statusClass(s){return s==='online'?'online':s==='degraded'?'degradedText':'offlineText'}
  function towerClass(s){return s==='offline'?'tower offline':s==='degraded'?'tower degraded':'tower'}

  function render(){
    document.getElementById('nodeCount').textContent=nodes.length;
    document.getElementById('onlineCount').textContent=nodes.filter(n=>n.status==='online').length;
    document.getElementById('cityCount').textContent=new Set(nodes.map(n=>n.city||'Unassigned')).size;
    const cpus=nodes.map(n=>Number(n.cpu_percent)).filter(Number.isFinite); document.getElementById('avgCpu').textContent=(cpus.length?(cpus.reduce((a,b)=>a+b,0)/cpus.length).toFixed(1):'0')+'%';
    if(!nodes.length){network.innerHTML='<div class="empty">Waiting for Jungle nodes…</div>';return}
    const islands={}; nodes.forEach(n=>{const i=n.island||'Local Jungle'; const c=n.city||'Unassigned City'; (((islands[i]??={})[c])??=[]).push(n)});
    network.innerHTML=Object.entries(islands).map(([island,cities])=>`<div class="island"><div class="island-title">Island · ${esc(island)}</div>${Object.entries(cities).map(([city,list])=>`<div style="margin-bottom:12px"><div style="font-size:11px;color:#7dd3fc;margin:0 0 8px">City · ${esc(city)}</div><div class="city-grid">${list.map(n=>`<button class="${towerClass(n.status)}" data-id="${n.id}" style="text-align:left;color:inherit"><div class="tower-head"><div class="tower-name">${esc(n.name)}</div><span class="badge ${statusClass(n.status)}">${esc(n.status)}</span></div><div class="type">${esc(n.node_type)} · v${esc(n.version)}</div><div class="bars"><div class="row"><span>CPU</span><div class="bar"><div class="fill" style="width:${pct(n.cpu_percent)}%"></div></div><span>${pct(n.cpu_percent).toFixed(0)}%</span></div><div class="row memory"><span>Memory</span><div class="bar"><div class="fill" style="width:${pct(n.memory_percent)}%"></div></div><span>${pct(n.memory_percent).toFixed(0)}%</span></div></div></button>`).join('')}</div></div>`).join('')}</div>`).join('');
    network.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>showDetail(b.dataset.id)));
  }

  function showDetail(id){const n=nodes.find(x=>x.id===id);if(!n)return; detail.classList.add('show');detail.innerHTML=`<div class="kv"><b>Tower</b><span>${esc(n.name)}</span></div><div class="kv"><b>Type</b><span>${esc(n.node_type)}</span></div><div class="kv"><b>Environment</b><span>${esc(n.environment)}</span></div><div class="kv"><b>Location</b><span>${esc(n.city||'—')} / ${esc(n.island||'—')}</span></div><div class="kv"><b>Last seen</b><span>${new Date(n.last_seen_at).toLocaleString()}</span></div><div class="kv"><b>Capabilities</b><span class="caps">${(n.capabilities||[]).map(c=>`<span class="cap">${esc(c)}</span>`).join('')||'—'}</span></div>`}

  function renderEvents(){if(!events.length){eventsEl.innerHTML='<div class="empty">Waiting for platform events…</div>';return} eventsEl.innerHTML=events.slice(0,60).map(e=>`<div class="event"><strong>${esc(e.event_type)}</strong><div>${esc(e.source)} · ${new Date(e.occurred_at).toLocaleTimeString()}${e.subject?' · '+esc(e.subject):''}</div></div>`).join('')}

  async function refresh(){try{const r=await fetch('/api/nodes');if(!r.ok)throw new Error(r.status);nodes=await r.json();render();document.getElementById('connection').textContent='live'}catch(e){document.getElementById('connection').textContent='degraded'}}
  function connectEvents(){const es=new EventSource('/api/events');es.onopen=()=>document.getElementById('connection').textContent='live';es.onerror=()=>document.getElementById('connection').textContent='reconnecting';['node.registered','node.heartbeat','node.health_changed'].forEach(type=>es.addEventListener(type,e=>{try{events.unshift(JSON.parse(e.data));renderEvents();refresh()}catch(_){}}))}
  refresh(); connectEvents(); setInterval(refresh,5000);
</script>
</body>
</html>
