services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - jungle-postgres:/var/lib/postgresql/data

  registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    environment:
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle
      JUNGLE_BIND: 0.0.0.0:8080
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  simulator:
    image: python:3.13-alpine
    working_dir: /simulator
    command: ["python", "simulator.py"]
    environment:
      JUNGLE_REGISTRY: http://registry:8080
    volumes:
      - ./simulator:/simulator:ro
    depends_on:
      - registry

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - registry
    ports:
      - "13133:13133"

volumes:
  jungle-postgres:
